<text x="970.0" y="1308" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">429 · Demasiadas veces</text>
<text x="970.0" y="1329" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#A5B4FC" text-anchor="middle" opacity="1">Avisa que espere unos</text>
<text x="970.0" y="1345" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#A5B4FC" text-anchor="middle" opacity="1">minutos antes de insistir.</text>
