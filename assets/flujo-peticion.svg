<rect x="40" y="394" width="300" height="92" rx="9" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
<text x="190.0" y="418" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">Contesta el navegador</text>
<text x="190.0" y="439" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#A5B4FC" text-anchor="middle" opacity="1">con datos falsos. La petición</text>
<text x="190.0" y="455" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#A5B4FC" text-anchor="middle" opacity="1">nunca sale del equipo: ni correos,</text>
<text x="190.0" y="471" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#A5B4FC" text-anchor="middle" opacity="1">ni subidas, ni gasto de IA.</text>
