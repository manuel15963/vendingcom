<text x="1020.0" y="572" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#A5B4FC" text-anchor="middle" opacity="1">Limpia toda la caché para</text>
