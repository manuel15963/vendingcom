<text x="600.0" y="627.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#A5B4FC" text-anchor="middle" opacity="1">La visita, el efectivo y las lecturas quedan registrados como si hubiera habido señal</text>
