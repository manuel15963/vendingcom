<text x="80" y="252" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">·  Viajes y paradas de la ruta</text>
<text x="80" y="279" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">·  Inventario de cada máquina</text>
