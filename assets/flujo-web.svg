<circle cx="60" cy="318" r="13" fill="#6D28D9" stroke="#A855F7" stroke-width="1.5"/>
<text x="60" y="322.5" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">5</text>
<text x="82" y="323" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1">Servicio</text>
<text x="56" y="352" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">Cloud Run despierta el micro-</text>
<text x="56" y="369" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">servicio si estaba apagado.</text>
<text x="56" y="386" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">El servicio valida el token</text>
<text x="56" y="403" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">antes de tocar nada.</text>
<rect x="334" y="294" width="272" height="150" rx="10" fill="#4C1D95" stroke="#8B5CF6" stroke-width="1.5"/>
<circle cx="358" cy="318" r="13" fill="#6D28D9" stroke="#A855F7" stroke-width="1.5"/>
<text x="358" y="322.5" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">6</text>
<text x="380" y="323" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1">Aislamiento</text>
<text x="354" y="352" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">La consulta se filtra por la</text>
<text x="354" y="369" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">empresa del token. Nadie ve</text>
<text x="354" y="386" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">datos de otra empresa aunque</text>
<text x="354" y="403" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">manipule la petición.</text>
<rect x="632" y="294" width="272" height="150" rx="10" fill="#0F172A" stroke="#A855F7" stroke-width="1.5"/>
<circle cx="656" cy="318" r="13" fill="#6D28D9" stroke="#A855F7" stroke-width="1.5"/>
<text x="656" y="322.5" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">7</text>
<text x="678" y="323" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1">Datos</text>
<text x="652" y="352" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">PostgreSQL devuelve solo las</text>
<text x="652" y="369" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">filas de esa empresa. Nada se</text>
<text x="652" y="386" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">borra físicamente: todo es</text>
<text x="652" y="403" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">baja lógica con estado.</text>
<rect x="930" y="294" width="272" height="150" rx="10" fill="#7C3AED" stroke="#C084FC" stroke-width="1.5"/>
<circle cx="954" cy="318" r="13" fill="#6D28D9" stroke="#A855F7" stroke-width="1.5"/>
<text x="954" y="322.5" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">8</text>
<text x="976" y="323" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1">Vuelta</text>
<text x="950" y="352" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">La lectura se guarda en caché</text>
<text x="950" y="369" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">por poco tiempo. Cualquier</text>
<text x="950" y="386" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">escritura la limpia entera,</text>
<text x="950" y="403" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">así nunca se ve dato viejo.</text>
