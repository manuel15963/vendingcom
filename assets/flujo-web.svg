<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" role="img" aria-label="Flujo de extremo a extremo de la aplicación web">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B5CF6"/></marker>
<linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1D4ED8"/><stop offset="100%" stop-color="#6D28D9"/></linearGradient>
</defs>
<rect width="1200" height="700" fill="#0D1117"/>
<text x="600" y="40" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#A5B4FC" text-anchor="middle" opacity="1">De un clic en el navegador hasta la fila en la base de datos</text>
<rect x="36" y="80" width="272" height="150" rx="10" fill="url(#gc)" stroke="#3B82F6" stroke-width="1.5"/>
<circle cx="60" cy="104" r="13" fill="#6D28D9" stroke="#A855F7" stroke-width="1.5"/>
<text x="60" y="108.5" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">1</text>
<text x="82" y="109" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1">Ingreso</text>
<text x="56" y="138" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">El usuario envía correo y</text>
<text x="56" y="155" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">contraseña a auth-service.</text>
<text x="56" y="172" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">Se limita el número de</text>
<text x="56" y="189" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">intentos por dirección IP.</text>
<rect x="334" y="80" width="272" height="150" rx="10" fill="#6D28D9" stroke="#A855F7" stroke-width="1.5"/>
<circle cx="358" cy="104" r="13" fill="#6D28D9" stroke="#A855F7" stroke-width="1.5"/>
<text x="358" y="108.5" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">2</text>
<text x="380" y="109" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1">Token</text>
<text x="354" y="138" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">auth-service devuelve un JWT</text>
<text x="354" y="155" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">que lleva su rol y su empresa.</text>
<text x="354" y="172" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">El mismo token sirve para</text>
<text x="354" y="189" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">los doce servicios.</text>
<rect x="632" y="80" width="272" height="150" rx="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5"/>
<circle cx="656" cy="104" r="13" fill="#6D28D9" stroke="#A855F7" stroke-width="1.5"/>
<text x="656" y="108.5" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">3</text>
<text x="678" y="109" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1">Permisos</text>
<text x="652" y="138" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">La app guarda el token y el</text>
<text x="652" y="155" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">guard de ruta decide qué</text>
<text x="652" y="172" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">módulos puede abrir según</text>
<text x="652" y="189" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">el rol recibido.</text>
<rect x="930" y="80" width="272" height="150" rx="10" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5"/>
<circle cx="954" cy="104" r="13" fill="#6D28D9" stroke="#A855F7" stroke-width="1.5"/>
<text x="954" y="108.5" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">4</text>
<text x="976" y="109" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="start" opacity="1">Petición</text>
<text x="950" y="138" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">Al abrir un módulo, la llamada</text>
<text x="950" y="155" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">cruza los interceptores: demo,</text>
<text x="950" y="172" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">caché de lectura, cabecera</text>
<text x="950" y="189" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#A5B4FC" text-anchor="start" opacity="1">Bearer y control de 401.</text>
