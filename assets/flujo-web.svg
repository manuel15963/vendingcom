<text x="470.0" y="557.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity="1">Inventario</text>
<text x="470.0" y="575.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#A5B4FC" text-anchor="middle" opacity="1">suma el stock del almacén</text>
<rect x="630" y="528" width="240" height="64" rx="9" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5"/>
<text x="750.0" y="557.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity="1">Rutas y Visitas</text>
<text x="750.0" y="575.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#A5B4FC" text-anchor="middle" opacity="1">el operador la carga al camión</text>
<rect x="910" y="528" width="220" height="64" rx="9" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1.5"/>
<text x="1020.0" y="557.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" opacity="1">Recaudación</text>
<text x="1020.0" y="575.0" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#A5B4FC" text-anchor="middle" opacity="1">concilia el efectivo</text>
