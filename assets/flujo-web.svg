<path d="M 606 155 L 626 155" stroke="#8B5CF6" stroke-width="1.8" marker-end="url(#a)" opacity="0.9"/>
<path d="M 904 155 L 924 155" stroke="#8B5CF6" stroke-width="1.8" marker-end="url(#a)" opacity="0.9"/>
